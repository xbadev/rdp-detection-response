name: ci

on:
  push:
  pull_request:

jobs:
  powershell:
    name: PowerShell (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every PowerShell file with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.ps1, *.psm1, *.psd1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            foreach ($e in @($errors)) {
              $failed = $true
              Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
            }
          }
          if ($failed) { exit 1 }
          Write-Host "All PowerShell files parse under Windows PowerShell 5.1."

      - name: PSScriptAnalyzer (errors fail the build)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $results | Format-Table -AutoSize | Out-String | Write-Host
          if ($results) { exit 1 }

      - name: Pester unit tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5.0
          Invoke-Pester -Path .\tests -CI

  lint:
    name: Shell + encoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell files must be ASCII-only
        # Windows PowerShell 5.1 reads BOM-less files as Windows-1252, where
        # UTF-8 punctuation can decode into a quote character and break parsing.
        run: |
          bad=$(git ls-files '*.ps1' '*.psm1' '*.psd1' | xargs grep -lP '[^\x00-\x7F]' || true)
          if [ -n "$bad" ]; then echo "Non-ASCII characters in:"; echo "$bad"; exit 1; fi

      - name: shellcheck
        run: shellcheck attacker/run-attack.sh
